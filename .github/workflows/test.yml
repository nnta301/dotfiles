name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y rclone shellcheck stow zsh
      - name: Check shell syntax
        run: |
          for script in setup.sh scripts/*.sh hypr/.config/hypr/UserScripts/*.sh; do
            bash -n "$script"
          done
          zsh -n zsh/.zshrc
      - name: Run shellcheck
        run: shellcheck --severity=warning setup.sh scripts/*.sh hypr/.config/hypr/UserScripts/*.sh
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
